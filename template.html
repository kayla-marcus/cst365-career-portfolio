<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Meridian Bank SRE Incident Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f17;
        --s1: #121826;
        --s2: #182033;
        --line: #263046;
        --ink: #e8edf7;
        --mut: #9aa7bf;
        --acc: #6ea8ff;
        --accd: #2f5fc4;
        --crit: #ff7b7b;
        --warn: #f5b942;
        --ok: #3ecf8e;
        --r: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(1200px 500px at 70% -10%, #16213a 0, transparent 60%), var(--bg);
        color: var(--ink);
        font:
          15px/1.55 Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(11, 15, 23, 0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        padding: 12px 24px;
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
      }
      header h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 0;
        color: var(--mut);
        font-size: 13px;
      }
      header p::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
        margin-right: 8px;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 24px 48px;
      }
      h2 {
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin: 30px 0 10px;
      }
      h3 {
        font-size: 14px;
        font-weight: 650;
        color: var(--mut);
        margin: 18px 0 8px;
      }
      section,
      .card {
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px 18px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.03) inset,
          0 8px 24px rgba(0, 0, 0, 0.25);
      }
      section {
        margin-bottom: 14px;
        overflow-x: auto;
      }
      .card {
        background: var(--s2);
        box-shadow: none;
        margin: 8px 0;
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .two {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
        margin-bottom: 14px;
      }
      .two > section {
        margin: 0;
      }
      .big {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin-top: 2px;
      }
      .mut {
        color: var(--mut);
        font-size: 13px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 650;
        border: 1px solid;
        white-space: nowrap;
      }
      .crit {
        color: var(--crit);
        background: rgba(255, 123, 123, 0.12);
        border-color: rgba(255, 123, 123, 0.45);
      }
      .warn {
        color: var(--warn);
        background: rgba(245, 185, 66, 0.12);
        border-color: rgba(245, 185, 66, 0.45);
      }
      .ok {
        color: var(--ok);
        background: rgba(62, 207, 142, 0.12);
        border-color: rgba(62, 207, 142, 0.45);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: var(--mut);
        font-weight: 600;
        font-size: 12.5px;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: rgba(110, 168, 255, 0.05);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: var(--ink);
      }
      button {
        background: var(--s2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 12px;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      button:hover:not(:disabled) {
        border-color: var(--acc);
        background: #1d2942;
      }
      button.p {
        background: var(--accd);
        border-color: var(--accd);
        font-weight: 600;
      }
      button.p:hover:not(:disabled) {
        background: #3a6fd8;
        border-color: #3a6fd8;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      input,
      select,
      textarea {
        background: #0e1422;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
      }
      input[type='checkbox'] {
        accent-color: var(--acc);
        width: 16px;
        height: 16px;
        vertical-align: -3px;
        margin-right: 6px;
      }
      :focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .bar {
        height: 10px;
        background: #0e1422;
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
        margin: 8px 0 12px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: var(--ok);
      }
      .bar i.warn {
        background: var(--warn);
      }
      .bar i.crit {
        background: var(--crit);
      }
      .log,
      pre {
        font:
          12.5px ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
      }
      pre {
        white-space: pre-wrap;
        overflow-x: auto;
      }
      .log td {
        padding: 6px 8px;
      }
      tr.sel {
        background: rgba(110, 168, 255, 0.1);
      }
      tr.sel td:first-child {
        box-shadow: inset 3px 0 var(--acc);
      }
      .pill.st {
        font-size: 14px;
        padding: 4px 14px;
      }
      a.btn {
        display: inline-block;
        background: var(--s2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 12px;
        color: var(--ink);
        text-decoration: none;
      }
      a.btn:hover {
        border-color: var(--acc);
      }
      tr.active td:first-child {
        box-shadow: inset 4px 0 var(--crit);
      }
      tr.resolved td:first-child {
        box-shadow: inset 4px 0 var(--ok);
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 6px;
        overflow-x: auto;
      }
      .tabs button {
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: 0;
        padding: 10px 16px;
        color: var(--mut);
        font-weight: 600;
        white-space: nowrap;
      }
      .tabs button[aria-selected='true'] {
        color: var(--ink);
        border-bottom-color: var(--acc);
      }
      \n#detail,
      #draft {
        scroll-margin-top: 72px;
      }
      .acc {
        color: var(--acc);
        background: rgba(110, 168, 255, 0.12);
        border-color: rgba(110, 168, 255, 0.45);
      }
      tr.contact {
        background: rgba(245, 185, 66, 0.1);
      }
      tr.contact td:first-child {
        box-shadow: inset 4px 0 var(--warn);
      }
      .rec {
        margin: 10px 0;
        padding: 8px 12px;
        border-radius: 8px;
        border-left: 4px solid;
        font-size: 13.5px;
      }
      .rec.crit,
      .rec.warn,
      .rec.ok {
        color: var(--ink);
      }
      .rec b {
        display: block;
      }
      textarea {
        width: 100%;
        min-height: 300px;
        font:
          13px/1.55 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin: 8px 0;
      }
      ul {
        padding-left: 20px;
        margin: 6px 0;
      }
      li {
        margin: 2px 0;
      }
      label {
        cursor: pointer;
      }
      p {
        margin: 6px 0;
      }
      b {
        font-weight: 650;
      }
      @media (max-width: 640px) {
        main {
          padding: 14px 12px 40px;
        }
        header {
          padding: 10px 14px;
        }
        .big {
          font-size: 24px;
        }
        section,
        .card {
          padding: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Meridian Bank SRE Incident Dashboard</h1>
      <p>Simulated data from a fictional banking scenario. Not connected to live monitoring.</p>
    </header>
    <main id="app" aria-live="polite"></main>
    <!--SCRIPTS-->
  </body>
</html>
